name: 🇺🇸 KIS 라오어 무한매수법 무인 자동매매

on:
  schedule:
    # 한국시간(KST) 평일 밤 22:35 (서머타임: UTC 13:35) & 23:35 (겨울철: UTC 14:35)
    # 미국 정규장 및 LOC 주문 개시 시간(22:30/23:30 KST) 직후 실행
    - cron: '35 13 * * 1-5'
    - cron: '35 14 * * 1-5'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 제공

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필수 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 라오어 무한매수 당일 주문 자동 실행
        env:
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Seoul"
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_CANO: ${{ secrets.KIS_CANO }}
          KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
          KIS_ACCOUNT_PWD: ${{ secrets.KIS_ACCOUNT_PWD }}
        run: |
          python run_infinite_buying.py

      - name: 5. 무한매수 진행 회차 상태(infinite_trader_state.json) Git 저장소 자동 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 [GitHub Actions] 무한매수 진행 회차 및 평단가 상태 자동 갱신'
          file_pattern: 'infinite_trader_state.json'
