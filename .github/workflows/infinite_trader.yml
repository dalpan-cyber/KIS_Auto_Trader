name: 🇺🇸 KIS 라오어 무한매수법 무인 자동매매

on:
  schedule:
    # 1) 한국시간(KST) 평일 밤 21:59 (UTC 12:59) - 당일 LOC 매수 & 익절 매도 주문 발주 (30분 앞당김)
    - cron: '59 12 * * 1-5'
    # 2) 한국시간(KST) 화~토 아침 05:12 (UTC 20:12) - 장 마감 1시간 후 체결 결과 확인 & Google Sheets 동기화
    - cron: '12 20 * * 1-5'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 제공

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필수 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 라오어 무한매수 당일 주문 자동 실행
        env:
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Seoul"
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_CANO: ${{ secrets.KIS_CANO }}
          KIS_ACNT_PRDT_CD: ${{ secrets.KIS_ACNT_PRDT_CD }}
          KIS_ACCOUNT_PWD: ${{ secrets.KIS_ACCOUNT_PWD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python run_infinite_buying.py


      - name: 5. 무한매수 진행 회차 상태(infinite_trader_state.json) 및 설정(infinite_settings.json) Git 저장소 자동 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 [GitHub Actions] 무한매수 진행 회차 및 설정 상태 자동 갱신'
          file_pattern: 'infinite_trader_state.json infinite_settings.json'
