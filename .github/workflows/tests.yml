name: 단위 테스트 (pytest)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infinite_trader_state.json'
      - 'infinite_settings.json'
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/conftest.py가 KIS/구글 시트/텔레그램 연동을 차단하고 상태 파일을 임시 디렉터리로 격리
      - name: pytest 실행
        env:
          TZ: "Asia/Seoul"
        run: pytest
